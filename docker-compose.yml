services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
    expose:
      - "8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
      FASTAPI_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - uploads:/app/apps/web/uploads
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  media:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: media
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - uploads:/app/apps/web/uploads
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: seed
    profiles: ["tools"]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://web:3000
    volumes:
      - uploads:/app/apps/web/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  data-mirror:
    image: alpine:3.21
    profiles: ["tools"]
    volumes:
      - ./apps/web/uploads:/source:ro
      - uploads:/target
    command: ["sh", "-c", "cp -a /source/. /target/ && echo 'Host uploads mirrored to the Docker uploads volume.'"]

volumes:
  mongo-data:
  redis-data:
  uploads:

