services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    expose:
      - "27017"
    ports:
      # This machine only, for MongoDB Compass and running the web app outside Docker.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
    expose:
      - "8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
      FASTAPI_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MODERATION_URL: http://moderation:8010
      LIVEKIT_HOST: http://livekit:7880
      # The container's filesystem is read-only; AdminJS bundles its client here at startup.
      ADMIN_JS_TMP_DIR: /tmp/adminjs
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      - uploads:/app/apps/web/uploads
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  media:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: media
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - uploads:/app/apps/web/uploads
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # BullMQ worker for moderation scans, ad accounting and call timeouts. Uses the media image for ffmpeg.
  jobs:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: media
    command: ["node", "dist/jobs-worker.js"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MODERATION_URL: http://moderation:8010
      LIVEKIT_HOST: http://livekit:7880
    volumes:
      - uploads:/app/apps/web/uploads
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The AI models. Optional so a small machine can run the rest: `docker compose --profile moderation up -d`.
  # The first start downloads about 2.5 GB into the volume; scans wait for it. Measured at 1.45 GB of memory once loaded.
  moderation:
    build: ./apps/moderation
    profiles: ["moderation"]
    restart: unless-stopped
    environment:
      # Without a secret the service refuses every request.
      MODERATION_SECRET: ${MODERATION_SECRET:-}
      MODERATION_THREADS: ${MODERATION_THREADS:-2}
    expose:
      - "8010"
    volumes:
      - moderation-models:/models
    mem_limit: ${MODERATION_MEMORY:-3g}
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  # Media server for voice and video calls: `docker compose --profile calls up -d`. On a VPS, open the ports below
  # in the firewall and set LIVEKIT_NODE_IP to its public address. Port 7880 stays local for the HTTPS proxy.
  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ["calls"]
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50200
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        turn:
          enabled: true
          udp_port: 3478
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-devsecret-devsecret-devsecret}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - http://web:3000/webhooks/livekit
    ports:
      - "${LIVEKIT_BIND:-127.0.0.1}:7880:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
      - "3478:3478/udp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  seed:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: seed
    profiles: ["tools"]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-oremus}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://web:3000
    volumes:
      - uploads:/app/apps/web/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  data-mirror:
    image: alpine:3.21
    profiles: ["tools"]
    volumes:
      - ./apps/web/uploads:/source:ro
      - uploads:/target
    command: ["sh", "-c", "cp -a /source/. /target/ && echo 'Host uploads mirrored to the Docker uploads volume.'"]

volumes:
  mongo-data:
  redis-data:
  uploads:
  moderation-models:

