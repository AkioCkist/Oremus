    <path d="M115 330c30 50 45 100 40 150" stroke="#141416" stroke-width="40" stroke-linecap="round" fill="none"/>
    <ellipse cx="50" cy="515" rx="34" ry="18" fill="#2a2a2e"/>
    <ellipse cx="162" cy="486" rx="34" ry="18" fill="#2a2a2e"/>
    <rect x="76" y="112" width="30" height="36" rx="10" fill="#5b3a26"/>
    <circle cx="91" cy="80" r="44" fill="#5b3a26"/>
    <path d="M48 66c4-28 24-42 44-42s40 14 42 42c-8-10-26-14-44-14s-34 4-42 14Z" fill="#141414"/>
    <g fill="none" stroke="#1d1d1d" stroke-width="4"><rect x="62" y="80" width="22" height="16" rx="6"/><rect x="98" y="80" width="22" height="16" rx="6"/><path d="M84 86h14"/></g>
    <path d="M74 106c8 14 26 14 34 0Z" fill="#fff" stroke="#2b140b" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- floating social sparkles -->
  <g opacity=".9">
    <g transform="translate(90 170)"><circle r="34" fill="#fff"/><path d="M0 14S-16 4-16-6a9 9 0 0 1 16-5 9 9 0 0 1 16 5C16 4 0 14 0 14Z" fill="#e61739"/></g>
    <g transform="translate(700 210)"><circle r="34" fill="#fff"/><path d="M-12 -2h6v14h-6Zm9 14V-1l7-11c1-2 4-1 4 1v7h7a3 3 0 0 1 3 4l-3 10a3 3 0 0 1-3 2Z" fill="#4150cf"/></g>
    <g transform="translate(470 140)"><circle r="26" fill="#fff"/><circle cx="-8" cy="-3" r="3" fill="#5f3a0c"/><circle cx="8" cy="-3" r="3" fill="#5f3a0c"/><path d="M-10 5c6 8 14 8 20 0" stroke="#5f3a0c" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  </g>
  <g fill="#fff" opacity=".85"><circle cx="230" cy="110" r="4"/><circle cx="380" cy="80" r="3"/><circle cx="600" cy="120" r="5"/><circle cx="740" cy="330" r="3"/><circle cx="40" cy="360" r="4"/><circle cx="520" cy="260" r="3"/></g>
</svg>
