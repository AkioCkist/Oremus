    <path d="M65 340c-30 60-70 100-120 115" stroke="#1d1e22" stroke-width="42" stroke-linecap="round" fill="none"/>
    <path d="M115 340c35 40 60 95 60 160" stroke="#1d1e22" stroke-width="42" stroke-linecap="round" fill="none"/>
    <ellipse cx="-62" cy="460" rx="36" ry="18" fill="#f3f3f3" stroke="#cfd6e0" stroke-width="4"/>
    <ellipse cx="182" cy="512" rx="36" ry="18" fill="#f3f3f3" stroke="#cfd6e0" stroke-width="4"/>
    <rect x="76" y="112" width="30" height="36" rx="10" fill="#e9c3a4"/>
    <circle cx="91" cy="80" r="44" fill="#e9c3a4"/>
    <path d="M47 70c0-30 20-48 46-48s44 16 46 40l26 6c4 2 3 6-1 7l-114 3Z" fill="#26272b"/>
    <path d="M60 104c6 18 22 30 32 30s24-10 30-26" fill="#7a5134"/>
    <g fill="none" stroke="#1d1d1d" stroke-width="4"><rect x="62" y="80" width="22" height="16" rx="6"/><rect x="98" y="80" width="22" height="16" rx="6"/><path d="M84 86h14"/></g>
    <ellipse cx="91" cy="112" rx="11" ry="9" fill="#5a2b1a"/>
    <path d="M84 109h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
