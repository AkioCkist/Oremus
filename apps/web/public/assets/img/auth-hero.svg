  <path d="M0 660c140-30 300-40 420-25s260 30 380 10v355H0Z" fill="url(#snow)"/>
  <path d="M300 1000c40-130 90-250 150-345h70c10 95 30 215 60 345Z" fill="url(#path)" opacity=".75"/>

