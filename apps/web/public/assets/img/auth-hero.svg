    <circle cx="0" cy="8" r="17" fill="#8a5a3b"/>
    <circle cx="191" cy="35" r="17" fill="#8a5a3b"/>
    <rect x="30" y="140" width="110" height="190" rx="46" fill="#6b5f4a"/>
    <rect x="52" y="150" width="66" height="150" rx="20" fill="#f2f2f2"/>
    <path d="M70 200h30M66 230h38M74 260h22" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>
    <path d="M60 320c-15 70-40 120-80 150" stroke="#44628f" stroke-width="40" stroke-linecap="round" fill="none"/>
    <path d="M110 320c10 70 5 130-10 175" stroke="#44628f" stroke-width="40" stroke-linecap="round" fill="none"/>
    <ellipse cx="-30" cy="478" rx="34" ry="18" fill="#ffffff" stroke="#cfd6e0" stroke-width="4"/>
    <ellipse cx="96" cy="505" rx="34" ry="18" fill="#ffffff" stroke="#cfd6e0" stroke-width="4"/>
    <rect x="70" y="112" width="30" height="34" rx="10" fill="#8a5a3b"/>
    <circle cx="85" cy="80" r="44" fill="#8a5a3b"/>
    <g fill="#2a1a12">
      <circle cx="48" cy="52" r="22"/><circle cx="68" cy="34" r="22"/><circle cx="94" cy="30" r="22"/><circle cx="118" cy="44" r="22"/><circle cx="128" cy="70" r="18"/><circle cx="42" cy="78" r="16"/><circle cx="36" cy="100" r="14"/>
    </g>
    <g fill="none" stroke="#1d1d1d" stroke-width="4"><circle cx="70" cy="86" r="11"/><circle cx="102" cy="86" r="11"/><path d="M81 86h10"/></g>
    <path d="M70 108c10 12 26 12 34 0Z" fill="#fff" stroke="#5a2b1a" stroke-width="3" stroke-linejoin="round"/>
  </g>

