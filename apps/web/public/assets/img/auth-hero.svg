<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Three friends jumping for joy in a snowy park">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d6ea"/><stop offset=".6" stop-color="#e8eef7"/><stop offset="1" stop-color="#f6f8fb"/></linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6f0"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8b2aa"/><stop offset="1" stop-color="#8e877e"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <!-- distant trees -->
  <g stroke="#9aa3ae" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M70 640V420M70 500l-40-50M70 470l35-55M70 540l45-30"/>
    <path d="M700 650V380M700 470l-50-60M700 440l40-70M700 520l55-40M700 560l-45-30"/>
    <path d="M610 640V470M610 520l-30-40M610 500l35-45"/>
    <path d="M170 650V500M170 550l-28-35M170 530l30-40"/>
  </g>
  <g fill="#7c8794" opacity=".35">
